name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5433/opspilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5433/opspilot_test
      # TEST_REDIS_URL, not REDIS_URL: apps/api/tests/conftest.py only
      # *defaults* REDIS_URL from this if REDIS_URL isn't already set, so
      # tests land on their own isolated db (15) instead of sharing one
      # rate-limit counter with anything else that touches db 0.
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
      APP_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long-too
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy apps/api/app apps/mcp-server evals

      - name: Run migrations
        run: uv run --directory apps/api alembic upgrade head

      - name: Run tests
        run: uv run pytest --maxfail=1

      - name: Run golden evaluation dataset (quality gate)
        run: uv run python evals/run_evals.py --json-out eval-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
